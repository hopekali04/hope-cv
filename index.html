<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hope Kalitera - Redirecting</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: #ffffff;
        }
        .redirect-container {
            text-align: center;
            background: #1a1a1a;
            padding: 60px 40px;
            border-radius: 4px;
            border: 1px solid #2d2d2d;
            max-width: 600px;
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        h1 {
            color: #ffffff;
            font-size: 2rem;
            margin-bottom: 16px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        p {
            color: #a3a3a3;
            font-size: 1rem;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        .btn-redirect {
            background: #ffffff;
            color: #000000;
            padding: 12px 32px;
            font-size: 0.95rem;
            border: 1px solid #ffffff;
            border-radius: 2px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
            font-weight: 500;
        }
        .btn-redirect:hover {
            background: #e5e5e5;
            border-color: #e5e5e5;
            color: #000000;
        }
        .icon {
            font-size: 2.5rem;
            margin-bottom: 24px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="icon">🚀</div>
        <h1>Website Has Moved!</h1>
        <p>This website is no longer maintained. Please visit my new portfolio website for the latest updates and projects.</p>
        <a href="https://hopekali.vercel.app" class="btn-redirect">
            Click Here to View New Website
        </a>
    </div>
</body>
</html>
